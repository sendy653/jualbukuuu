                  <select 
                    value={selectedCategory} 
                    onChange={(e) => setSelectedCategory(e.target.value)}
                    className="px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-medium outline-none"
                  >
                    <option value="all">Semua Kategori</option>
                    <option value="buku">Buku</option>
                    <option value="komik">Komik</option>
                    <option value="novel">Novel</option>
                    <option value="self-improvement">Self Improvement</option>
                    <option value="non-fiksi">Non-Fiksi</option>
                  </select>

                  <select 
                    value={selectedPriceRange} 
                    onChange={(e) => setSelectedPriceRange(e.target.value)}
                    className="px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-medium outline-none"
                  >
                    <option value="all">Semua Harga</option>
                    <option value="under50">Di bawah Rp 50 rb</option>
                    <option value="50to100">Rp 50 rb - Rp 100 rb</option>
                    <option value="above100">Di atas Rp 100 rb</option>
                  </select>

                  <select 
                    value={selectedSort} 
                    onChange={(e) => setSelectedSort(e.target.value)}
                    className="px-4 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-medium outline-none"
                  >
                    <option value="newest">Terbaru</option>
                    <option value="lowest">Harga Terendah</option>
                    <option value="highest">Harga Tertinggi</option>
                    <option value="rating">Rating Tertinggi</option>
                  </select>
                </div>
              </div>

              {/* Product Grid */}
              {filteredProducts.length === 0 ? (
                <div className="text-center py-20 bg-white dark:bg-slate-800 rounded-3xl border border-slate-100 dark:border-slate-700">
                  <i data-lucide="book-x" className="w-16 h-16 text-slate-300 mx-auto mb-4"></i>
                  <h3 className="text-lg font-bold text-slate-800 dark:text-white">Tidak ada buku yang ditemukan</h3>
                  <p className="text-sm text-slate-400 mt-1">Coba sesuaikan filter atau kata kunci pencarian kamu.</p>
                </div>
              ) : (
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                  {filteredProducts.map(product => (
                    <div key={product.id} className="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-100 dark:border-slate-700 flex flex-col justify-between group hover:shadow-2xl transition-all">
                      <div>
                        {/* Book Cover */}
                        <div className="relative aspect-[3/4] rounded-xl overflow-hidden mb-4 bg-slate-100 dark:bg-slate-900 cursor-pointer" onClick={() => setSelectedProduct(product)}>
                          <img src={product.cover} alt={product.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                          
                          {product.isBestSeller && (
                            <span className="absolute top-3 left-3 px-3 py-1 bg-amber-500 text-slate-900 text-[10px] font-black uppercase rounded-full shadow-md">
                              Best Seller
                            </span>
                          )}

                          {product.discount > 0 && (
                            <span className="absolute bottom-3 left-3 px-2.5 py-1 bg-red-500 text-white text-[10px] font-bold rounded-md">
                              -{product.discount}%
                            </span>
                          )}

                          <button 
                            onClick={(e) => { e.stopPropagation(); toggleWishlist(product); }}
                            className="absolute top-3 right-3 p-2 rounded-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-sm text-slate-600 dark:text-slate-300 hover:text-red-500 transition-colors"
                          >
                            <i data-lucide="heart" className={`w-4 h-4 ${wishlist.some(w => w.id === product.id) ? 'fill-red-500 text-red-500' : ''}`}></i>
                          </button>
                        </div>

                        {/* Details */}
                        <span className="text-[10px] font-bold text-amber-500 uppercase tracking-wider">{product.categoryLabel}</span>
                        <h3 className="font-bold text-slate-900 dark:text-white line-clamp-1 cursor-pointer hover:text-amber-500 transition-colors" onClick={() => setSelectedProduct(product)}>
                          {product.title}
                        </h3>
                        <p className="text-xs text-slate-500 mb-2">{product.author}</p>

                        <div className="flex items-center gap-1 mb-3">
                          <i data-lucide="star" className="w-3.5 h-3.5 fill-amber-400 text-amber-400"></i>
                          <span className="text-xs font-bold">{product.rating}</span>
                          <span className="text-[10px] text-slate-400">({product.reviewsCount})</span>
                        </div>
                      </div>

                      {/* Footer Actions */}
                      <div className="pt-3 border-t border-slate-100 dark:border-slate-700/50 flex items-center justify-between">
                        <div>
                          {product.originalPrice > product.price && (
                            <span className="text-xs text-slate-400 line-through block">{formatIDR(product.originalPrice)}</span>
                          )}
                          <span className="text-base font-extrabold text-slate-900 dark:text-white">{formatIDR(product.price)}</span>
                        </div>
                        <button 
                          onClick={() => addToCart(product)}
                          className="p-3 bg-slate-900 dark:bg-amber-500 text-white dark:text-slate-900 rounded-xl hover:opacity-90 transition-opacity"
                        >
                          <i data-lucide="shopping-cart" className="w-4 h-4"></i>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </section>

            {/* Newsletter */}
            <section className="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="bg-slate-900 dark:bg-slate-800 rounded-3xl p-8 sm:p-12 text-center text-white relative overflow-hidden">
                <div className="relative z-10 max-w-2xl mx-auto">
                  <i data-lucide="mail" className="w-12 h-12 text-amber-500 mx-auto mb-4"></i>
                  <h2 className="text-3xl font-extrabold mb-3">Jangan Lewatkan Buku Baru & Promo</h2>
                  <p className="text-slate-300 text-sm mb-8">Dapatkan rekomendasi buku mingguan, rilis komik terbaru, dan promo diskon langsung di email Anda.</p>
                  
                  {newsletterSuccess ? (
                    <div className="p-4 bg-emerald-500/20 border border-emerald-500 text-emerald-300 rounded-xl font-medium">
                      ✓ Terima kasih telah berlangganan newsletter BookVerse!
                    </div>
                  ) : (
                    <form onSubmit={(e) => { e.preventDefault(); setNewsletterSuccess(true); }} className="flex flex-col sm:flex-row gap-3">
                      <input 
                        type="email" 
                        required 
                        placeholder="Masukkan alamat email kamu..."
                        className="flex-grow px-5 py-3.5 rounded-xl text-slate-900 bg-white dark:bg-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-amber-500 text-sm"
                      />
                      <button type="submit" className="px-8 py-3.5 bg-amber-500 text-slate-900 font-bold rounded-xl hover:bg-amber-600 transition-colors text-sm whitespace-nowrap">
                        Berlangganan
                      </button>
                    </form>
                  )}
                </div>
              </div>
            </section>
          </main>

          {/* Product Detail Modal */}
          {selectedProduct && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-3xl w-full p-6 sm:p-8 max-h-[90vh] overflow-y-auto relative shadow-2xl">
                <button onClick={() => setSelectedProduct(null)} className="absolute top-6 right-6 p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800">
                  <i data-lucide="x" className="w-6 h-6"></i>
                </button>

                <div className="grid sm:grid-cols-2 gap-8 items-start">
                  <div className="aspect-[3/4] bg-slate-100 rounded-2xl overflow-hidden shadow-lg">
                    <img src={selectedProduct.cover} alt={selectedProduct.title} className="w-full h-full object-cover" />
                  </div>

                  <div>
                    <span className="text-xs font-bold text-amber-500 uppercase tracking-widest">{selectedProduct.categoryLabel}</span>
                    <h2 className="text-2xl font-black text-slate-900 dark:text-white mt-1 mb-2">{selectedProduct.title}</h2>
                    <p className="text-sm text-slate-500 mb-4">Penulis: <span className="font-semibold text-slate-700 dark:text-slate-300">{selectedProduct.author}</span></p>

                    <div className="flex items-center gap-2 mb-4">
                      <i data-lucide="star" className="w-4 h-4 fill-amber-400 text-amber-400"></i>
                      <span className="font-bold text-sm">{selectedProduct.rating}</span>
                      <span className="text-xs text-slate-400">({selectedProduct.reviewsCount} Ulasan)</span>
                    </div>

                    <div className="p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl mb-6">
                      <div className="text-xs text-slate-400">Harga Spesial</div>
                      <div className="text-2xl font-black text-slate-900 dark:text-white">{formatIDR(selectedProduct.price)}</div>
                    </div>

                    <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed mb-6">{selectedProduct.description}</p>

                    <div className="grid grid-cols-2 gap-2 text-xs text-slate-500 mb-6 border-y py-4 dark:border-slate-800">
                      <div>Penerbit: <strong className="text-slate-800 dark:text-slate-200">{selectedProduct.publisher}</strong></div>
                      <div>ISBN: <strong className="text-slate-800 dark:text-slate-200">{selectedProduct.isbn}</strong></div>
                      <div>Jumlah Halaman: <strong className="text-slate-800 dark:text-slate-200">{selectedProduct.pages} Hal</strong></div>
                      <div>Bahasa: <strong className="text-slate-800 dark:text-slate-200">Indonesia</strong></div>
                    </div>

                    <button 
                      onClick={() => { addToCart(selectedProduct); setSelectedProduct(null); }}
                      className="w-full py-4 bg-amber-500 text-slate-900 font-extrabold rounded-2xl shadow-lg hover:bg-amber-600 transition-colors flex items-center justify-center gap-2"
                    >
                      <i data-lucide="shopping-cart" className="w-5 h-5"></i> Tambahkan ke Keranjang
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Cart & Checkout Drawer */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/60 backdrop-blur-sm">
              <div className="w-full max-w-md bg-white dark:bg-slate-900 h-full p-6 flex flex-col justify-between shadow-2xl">
                <div>
                  <div className="flex items-center justify-between border-b pb-4 dark:border-slate-800">
                    <h3 className="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2">
                      <i data-lucide="shopping-bag" className="w-5 h-5 text-amber-500"></i> 
                      {isCheckout ? 'Checkout Pesanan' : 'Keranjang Belanja'}
                    </h3>
                    <button onClick={() => { setIsCartOpen(false); setIsCheckout(false); }} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full">
                      <i data-lucide="x" className="w-5 h-5"></i>
                    </button>
                  </div>

                  {!isCheckout ? (
                    <div className="mt-6 space-y-4 max-h-[50vh] overflow-y-auto pr-2">
                      {cart.length === 0 ? (
                        <p className="text-center text-slate-400 py-12">Keranjang belanjaan Anda masih kosong.</p>
                      ) : (
                        cart.map(item => (
                          <div key={item.id} className="flex gap-4 items-center border-b pb-4 dark:border-slate-800">
                            <img src={item.cover} alt={item.title} className="w-14 h-18 object-cover rounded-lg" />
                            <div className="flex-grow">
                              <h4 className="font-bold text-sm text-slate-900 dark:text-white">{item.title}</h4>
                              <p className="text-xs text-slate-400">{formatIDR(item.price)}</p>
                              <div className="flex items-center gap-2 mt-2">
                                <button onClick={() => updateCartQty(item.id, -1)} className="w-6 h-6 bg-slate-100 dark:bg-slate-800 rounded font-bold text-xs">-</button>
                                <span className="text-xs font-bold">{item.qty}</span>
                                <button onClick={() => updateCartQty(item.id, 1)} className="w-6 h-6 bg-slate-100 dark:bg-slate-800 rounded font-bold text-xs">+</button>
                              </div>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  ) : (
                    <div className="mt-6 space-y-4 text-xs">
                      <h4 className="font-bold text-sm">Alamat Pengiriman</h4>
                      <input type="text" placeholder="Nama Lengkap" className="w-full p-3 bg-slate-100 dark:bg-slate-800 rounded-xl outline-none" />
                      <textarea placeholder="Alamat Lengkap Pengiriman" className="w-full p-3 bg-slate-100 dark:bg-slate-800 rounded-xl outline-none h-20"></textarea>
                      
                      <h4 className="font-bold text-sm pt-2">Metode Pembayaran</h4>
                      <select className="w-full p-3 bg-slate-100 dark:bg-slate-800 rounded-xl outline-none font-medium">
                        <option>QRIS / GoPay / OVO</option>
                        <option>Transfer Bank BCA</option>
                        <option>Kartu Kredit / Debit</option>
                      </select>
                    </div>
                  )}
                </div>

                {!isCheckout ? (
                  <div className="border-t pt-4 dark:border-slate-800">
                    {/* Promo Code Input */}
                    <div className="flex gap-2 mb-4">
                      <input 
                        type="text" 
                        placeholder="Kode Promo (BOOKVERSE10)" 
                        value={promoCode}
                        onChange={(e) => setPromoCode(e.target.value)}
                        className="flex-grow px-3 py-2 bg-slate-100 dark:bg-slate-800 text-xs rounded-xl outline-none uppercase font-bold"
                      />
                      <button onClick={handleApplyPromo} className="px-4 py-2 bg-slate-900 text-white dark:bg-slate-700 text-xs font-bold rounded-xl">Pakai</button>
                    </div>

                    <div className="space-y-1 text-xs text-slate-500 mb-4">
                      <div className="flex justify-between"><span>Subtotal:</span><span>{formatIDR(subtotal)}</span></div>
                      {discountApplied && <div className="flex justify-between text-emerald-500 font-bold"><span>Diskon (10%):</span><span>-{formatIDR(discountAmount)}</span></div>}
                      <div className="flex justify-between"><span>Ongkir:</span><span>{formatIDR(shippingFee)}</span></div>
                      <div className="flex justify-between text-base font-extrabold text-slate-900 dark:text-white pt-2 border-t"><span>Total:</span><span>{formatIDR(cartTotal)}</span></div>
                    </div>

                    <button 
                      disabled={cart.length === 0}
                      onClick={() => setIsCheckout(true)}
                      className="w-full py-4 bg-amber-500 text-slate-900 font-bold rounded-xl disabled:opacity-50 hover:bg-amber-600 transition-colors"
                    >
                      Lanjut ke Checkout
                    </button>
                  </div>
                ) : (
                  <div className="border-t pt-4 dark:border-slate-800">
                    <button 
                      onClick={() => {
                        alert('Pesanan berhasil diproses!');
                        setCart([]);
                        setIsCheckout(false);
                        setIsCartOpen(false);
                      }}
                      className="w-full py-4 bg-emerald-500 text-white font-bold rounded-xl hover:bg-emerald-600 transition-colors"
                    >
                      Konfirmasi & Bayar ({formatIDR(cartTotal)})
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* User Profile / Login Modal */}
          {isUserModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-sm w-full p-6 relative shadow-2xl text-center">
                <button onClick={() => setIsUserModalOpen(false)} className="absolute top-4 right-4 p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800">
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>

                <div className="w-16 h-16 rounded-full bg-amber-500/10 text-amber-500 flex items-center justify-center mx-auto mb-4">
                  <i data-lucide="user" className="w-8 h-8"></i>
                </div>
                <h3 className="font-bold text-lg text-slate-900 dark:text-white mb-1">Masuk ke BookVerse</h3>
                <p className="text-xs text-slate-400 mb-6">Akses riwayat pesanan dan simpan wishlist favoritmu.</p>

                <form onSubmit={(e) => { e.preventDefault(); setIsUserModalOpen(false); alert('Berhasil masuk!'); }} className="space-y-3">
                  <input type="email" required placeholder="Alamat Email" className="w-full p-3 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs outline-none" />
                  <input type="password" required placeholder="Kata Sandi" className="w-full p-3 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs outline-none" />
                  <button type="submit" className="w-full py-3 bg-amber-500 text-slate-900 font-bold rounded-xl text-xs hover:bg-amber-600 transition-colors">
                    Masuk Sekarang
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-slate-900 text-slate-400 py-12 border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-6">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-lg bg-amber-500 flex items-center justify-center text-slate-900 font-bold">BV</div>
                <span className="text-lg font-bold text-white">BookVerse</span>
              </div>
              <p className="text-xs">© 2026 BookVerse. Hak Cipta Dilindungi Undang-Undang.</p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
